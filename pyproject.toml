[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soe-radar"
version = "0.1.0"
description = "可追溯、跨年度的国央企校招截止时间雷达"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "alembic>=1.14,<2", "beautifulsoup4>=4.12,<5", "fastapi>=0.115,<1",
  "httpx>=0.28,<1", "jinja2>=3.1,<4", "pydantic>=2.10,<3",
  "pypdf>=5,<7", "python-multipart>=0.0.20,<1", "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3", "typer>=0.15,<1", "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
soe-radar = "soe_radar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/soe_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
