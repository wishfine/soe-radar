timezone: Asia/Shanghai
data_dir: data
schedule_hours: 6
source_pages: 5
details_per_source: 50
request_delay: 1.0
http_timeout: 25
# 仅控制招聘采集，不改变模型供应商或系统 VPN。
network_mode: env
proxy_env: SOE_RADAR_HTTP_PROXY
coverage_fresh_hours: 48
# 索引摘录不设置实时核验成功时间，也不自动认证企业性质。
bundled_catalogue: true
# 仅在已知可信的本机代理使用 198.18.0.0/15 Fake-IP DNS 时启用。
allow_fake_ip_dns: false
browser_enabled: false
browser_channel: null
jina_enabled: false
tavily_enabled: false
tavily_daily_limit: 20
llm:
  allow_paid: false
  monthly_budget_usd: 0
  daily_calls: 100
  max_attempts: 3
  timeout: 90
  max_output_tokens: 3000
  providers:
    - name: opencode
      protocol: chat_completions
      enabled: true
      base_url: https://opencode.ai/inference/openai/v1
      models: [glm-5.3-flash-free, deepseek-v4.1-flash-free]
      free_models: [glm-5.3-flash-free, deepseek-v4.1-flash-free]
      api_key_env: OPENCODE_API_KEY
      key_required: true
      billing: free
      input_usd_per_million: 0
      output_usd_per_million: 0
    - name: codex-local
      protocol: codex_cli
      enabled: false
      models: [gpt-6-luna]
      billing: subscription
      key_required: false
    - name: openai
      protocol: responses
      enabled: false
      base_url: https://api.openai.com/v1
      models: [gpt-6-luna]
      billing: paid
      api_key_env: OPENAI_API_KEY
      key_required: true
      # 未填写价格时禁止发出付费请求。启用前自行核实供应商单价。
      input_usd_per_million: 0
      output_usd_per_million: 0
